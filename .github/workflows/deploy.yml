name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Set this to "master" if your repository's primary branch uses the old naming scheme

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v4

      - name: Upload Static Web Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Uploads all root files (index.html, models, mind targets)

      - name: Deploy Artifact to GitHub Pages Live Hosting
        id: deployment
        uses: actions/deploy-pages@v4
