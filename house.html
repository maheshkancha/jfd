<!DOCTYPE html>

<head>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Modern House</title>

  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/jeromeetienne/AR.js/2.0.5/aframe/build/aframe-ar.js"></script>
  <script src="https://rawgit.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
  <a-scene vr-mode-ui="enabled: false" embedded arjs="debugUIEnabled: false; sourceType: webcam;">
    <a-marker-camera preset="hiro"></a-marker>
      <!-- <a-entity scale="0.30 0.30 0.30" position="0 0 0" gltf-model="url(./models/house.gltf);">
      </a-entity> -->

      <a-entity scale="3 3 3" rotation="0 90 0" position="2 0 0" gltf-model="url(./models/lotus.gltf);">
      </a-entity>

      <a-entity scale="3 3 3" rotation="90 0 0" position="-2 0 0" gltf-model="url(./models/lotus.glb);">
      </a-entity>

      <a-entity scale="3 5 3" rotation="0 0 0" position="0 3 0" gltf-model="url(./models/sheshnag.glb);">
      </a-entity>
  </a-scene>
</body>

</html>
