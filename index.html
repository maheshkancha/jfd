<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janmashtami AR Fancy Dress - Target Tracking</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* UI overlay for when the experience is loading or tracking is lost */
    #scanning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: sans-serif;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <a-scene mindar-image="imageTargetSrc: ./test-target.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="10000">
      <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
      <a-asset-item id="lotusModel" src="./Lotus.gltf"></a-asset-item>
      <a-asset-item id="sheshnagModel" src="./sheshnag.glb"></a-asset-item>
    </a-assets>

    <a-light type="directional" position="1 2 2" intensity="2" />

    <a-light type="ambient" intensity="1" />

    <a-camera position="0 0 0" look-controls="enabled: false" />

    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
      <a-box position="0 0 0" scale="0.2 0.2 0.2" color="yellow" />

      <a-gltf-model rotation="0 0 0 " position="0.5 2 0.5" scale="0.005 0.005 0.005" src="#avatarModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      <a-gltf-model rotation="0 0 0 " position="0 1 0" scale="3 3 3" src="#lotusModel">
      
      <a-entity id="lotus1" gltf-model="url(./Lotus.gltf)" position="0 1 0" rotation="-90 0 0" scale="2 2 2" />
    
      <a-entity id="lotus2" gltf-model="#lotusModel" position="2 1 0" rotation="-90 0 0" scale="3 3 3" />
    </a-entity>
  </a-scene>

  <!-- UI State Control Script -->
  <script>
    const targetEntity = document.querySelector('#ar-target');

    targetEntity.addEventListener("targetFound", () => {
      console.log("Found the target");
      overlay.classList.add('hidden');
    });
  </script>

</body>

</html>
